# Local development stack for the PrivateTube backend.
#
# Provides:
#   - `db`:      PostgreSQL (the same image/port the backend's Prisma client targets).
#   - `backend`: the NestJS API built from deployment/prod/Dockerfile.backend.
#
# The standalone transcription tool (scripts/transcribe.py) connects directly to
# the `db` PostgreSQL service, so you can run local Whisper transcription against
# the same database the API uses.
#
# Usage:
#   docker compose up -d db            # start only Postgres (fastest for transcription testing)
#   docker compose up -d               # start Postgres + the backend API
#   docker compose down -v             # stop and delete volumes
#
# The transcription script then connects via:
#   DATABASE_URL=postgresql://<user>:<password>@localhost:5432/<db>?schema=public

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: christiantube-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: christiantube
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d christiantube"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: the full API, wired to the Postgres above.
  backend:
    build:
      context: .
      dockerfile: deployment/prod/Dockerfile.backend
    container_name: christiantube-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - envs/common.env
      - ${ENV_FILE:-envs/neon.env}
    ports:
      - "3000:3000"

  youtube-processor:
    build:
      context: ./services/youtube-processor
    container_name: christiantube-youtube-processor
    restart: always
    env_file:
      - envs/common.env
      - ${ENV_FILE:-envs/neon.env}
    volumes:
      - processor-work:/work
      - ./services/youtube-processor/worker.py:/app/worker.py
      - ./services/youtube-processor/eligible_videos.sql:/app/eligible_videos.sql:ro
      - ./releases:/app/releases
      - ./.git/modules/releases:/app/.git/modules/releases

  embedder:
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
    container_name: christiantube-embedder
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - envs/common.env
      - ${ENV_FILE:-envs/neon.env}
    volumes:
      - ./services/embedder:/app
    command: ["python", "-u", "worker.py"]

  transcriber:
    build:
      context: .
      dockerfile: tools/transcriber/Dockerfile
    container_name: christiantube-transcriber
    restart: always
    env_file:
      - envs/common.env
      - ${ENV_FILE:-envs/neon.env}
    volumes:
      - content-work:/work
      - ./tools/transcriber/src:/app/src

  chunker:
    build:
      context: .
      dockerfile: services/chunker/Dockerfile
    container_name: christiantube-chunker
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - envs/common.env
      - ${ENV_FILE:-envs/neon.env}
    volumes:
      - ./services/chunker:/app
    command: ["python", "-u", "worker.py"]

volumes:
  pgdata:
  processor-work:
  content-work:


