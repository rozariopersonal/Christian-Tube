<!DOCTYPE html>
<html lang="ta" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>வேதாகம அருஞ்சொற்பொருள் | TAOVBSI Classical Biblical Lexicon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0B0F19;
      --bg-surface: rgba(18, 24, 38, 0.75);
      --bg-surface-hover: rgba(30, 41, 59, 0.85);
      --bg-card: rgba(15, 23, 42, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(245, 158, 11, 0.35);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;
      --accent-gold: #F59E0B;
      --accent-gold-glow: rgba(245, 158, 11, 0.15);
      --accent-blue: #38BDF8;
      --accent-indigo: #6366F1;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="amoled"] {
      --bg-base: #000000;
      --bg-surface: #0a0a0a;
      --bg-card: #050505;
      --border-subtle: rgba(255, 255, 255, 0.12);
    }

    [data-theme="light"] {
      --bg-base: #F8FAFC;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --bg-surface-hover: rgba(241, 245, 249, 0.95);
      --bg-card: #FFFFFF;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-highlight: rgba(217, 119, 6, 0.4);
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-subtle: #94A3B8;
      --accent-gold: #D97706;
      --accent-gold-glow: rgba(217, 119, 6, 0.12);
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans Tamil', -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.06) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .app-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 700;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--accent-gold-glow);
      color: var(--accent-gold);
      border: 1px solid var(--border-highlight);
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .brand-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-select {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: var(--transition);
    }
    .theme-select:hover {
      border-color: var(--accent-gold);
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 52px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0 46px 0 50px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(12px);
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .search-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px var(--accent-gold-glow);
      background: var(--bg-surface-hover);
    }

    .search-clear {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      font-size: 18px;
      display: none;
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .category-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      user-select: none;
    }

    .category-chip:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .category-chip.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }

    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }

    .glossary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-card);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .glossary-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent-gold);
      opacity: 0;
      transition: var(--transition);
    }

    .glossary-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-highlight);
      background: var(--bg-surface-hover);
      box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-gold-glow);
    }

    .glossary-card:hover::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .lemma-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .lemma-translit {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
      font-style: italic;
    }

    .badge-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .pos-badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
    }

    .cat-badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--accent-gold-glow);
      color: var(--accent-gold);
      border: 1px solid var(--border-highlight);
      font-weight: 600;
      text-transform: capitalize;
    }

    .gloss-english {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-blue);
      margin-bottom: 6px;
    }

    .definition-preview {
      font-size: 0.86rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
      flex-grow: 1;
      line-height: 1.5;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      color: var(--text-subtle);
    }

    .orig-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .strongs-tag {
      background: rgba(99, 102, 241, 0.15);
      color: #A5B4FC;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .forms-count {
      color: var(--text-subtle);
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform: scale(0.96) translateY(10px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .modal-backdrop.open .modal-dialog {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .modal-title-group h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .modal-title-group .translit {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition);
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text-main);
    }

    .modal-body {
      padding: 24px 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-block {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .def-tamil {
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.6;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .def-english {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .original-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(56, 189, 248, 0.05) 100%);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: var(--radius-md);
    }

    .original-word {
      font-size: 1.6rem;
      font-weight: 700;
      color: #C7D2FE;
    }

    .original-details {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
    }

    .tags-cluster {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tag-item {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
    }

    .modern-synonym {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.25);
      color: var(--accent-blue);
    }

    .example-card {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--accent-gold);
      padding: 10px 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-top: 8px;
    }

    .example-card p.ta {
      font-size: 0.92rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .example-card p.en {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-subtle);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand-group">
        <div class="brand-icon">வ</div>
        <div class="brand-text">
          <h1>வேதாகம அருஞ்சொற்பொருள் <span class="brand-badge">TAOVBSI Classical</span></h1>
          <p>Exhaustive Biblical Lexicon & Theological Concordance</p>
        </div>
      </div>
      <div class="header-actions">
        <select id="themeSelect" class="theme-select" aria-label="Theme">
          <option value="dark">Dark Theme</option>
          <option value="amoled">AMOLED Black</option>
          <option value="light">Light Theme</option>
        </select>
      </div>
    </header>

    <!-- Search & Filters -->
    <div class="controls-panel">
      <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search in Tamil (கிருபை), English (grace), Transliteration (kirubai), or Strong's (H2617)..." autofocus />
        <button id="searchClear" class="search-clear">&times;</button>
      </div>

      <div class="categories-bar" id="categoriesBar">
        <div class="category-chip active" data-cat="all">All Words (42)</div>
        <div class="category-chip" data-cat="theology">Theology</div>
        <div class="category-chip" data-cat="covenant">Covenant</div>
        <div class="category-chip" data-cat="divine_name">Divine Names</div>
        <div class="category-chip" data-cat="person">Persons</div>
        <div class="category-chip" data-cat="attribute">Attributes</div>
        <div class="category-chip" data-cat="action">Actions & Verbs</div>
        <div class="category-chip" data-cat="nature">Creation & Nature</div>
        <div class="category-chip" data-cat="other">Ceremonial & Objects</div>
      </div>
    </div>

    <!-- Results Meta -->
    <div class="results-meta">
      <span id="resultsCount">Showing 42 biblical terms</span>
      <span>Sorted by Classical Significance</span>
    </div>

    <!-- Cards Grid -->
    <div class="glossary-grid" id="glossaryGrid"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title-group">
          <h2 id="modalHeadword">கர்த்தர்</h2>
          <div class="translit" id="modalTranslit">karttar</div>
        </div>
        <button class="close-btn" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Load Data -->
  <script src="data.js"></script>

  <script>
    let currentFilter = 'all';
    let searchQuery = '';

    const grid = document.getElementById('glossaryGrid');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const resultsCount = document.getElementById('resultsCount');
    const categoriesBar = document.getElementById('categoriesBar');
    const detailModal = document.getElementById('detailModal');
    const modalClose = document.getElementById('modalClose');
    const themeSelect = document.getElementById('themeSelect');

    const dataList = window.GLOSSARY_DATA || [];

    function renderCards() {
      const q = searchQuery.toLowerCase().trim();
      const filtered = dataList.filter(item => {
        const matchesCategory = currentFilter === 'all' || item.category === currentFilter;
        if (!matchesCategory) return false;
        if (!q) return true;

        const hw = (item.headword || '').toLowerCase();
        const translit = (item.transliteration || '').toLowerCase();
        const gloss = (item.gloss_en || '').toLowerCase();
        const strongs = (item.original?.strongs || '').toLowerCase();
        const defTa = (item.definition_ta || '').toLowerCase();
        const defEn = (item.definition_en || '').toLowerCase();

        return hw.includes(q) || translit.includes(q) || gloss.includes(q) || strongs.includes(q) || defTa.includes(q) || defEn.includes(q);
      });

      resultsCount.textContent = 'Showing ' + filtered.length + ' biblical term' + (filtered.length === 1 ? '' : 's');

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 12px; opacity: 0.5;">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <h3>No matching glossary entries found</h3>
            <p>Try searching another Tamil root, English gloss, or Strong's code.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map((e, index) => {
        const origLemma = e.original && e.original.lemma ? e.original.lemma : '';
        const strongs = (e.original && e.original.strongs) || '';
        const formsCount = (e.forms || []).length;

        return `
          <div class="glossary-card" onclick="openEntryDetail('${e.id}')">
            <div class="card-top">
              <div>
                <div class="lemma-title">${e.headword}</div>
                <div class="lemma-translit">${e.transliteration || ''}</div>
              </div>
              <div class="badge-group">
                <span class="pos-badge">${e.pos_ta || e.pos}</span>
                <span class="cat-badge">${e.category || 'term'}</span>
              </div>
            </div>

            <div class="gloss-english">${e.gloss_en}</div>
            <div class="definition-preview">${e.definition_ta}</div>

            <div class="card-footer">
              <div class="orig-chip">
                ${origLemma ? '<span>' + origLemma + '</span>' : ''}
                ${strongs ? '<span class="strongs-tag">' + strongs + '</span>' : ''}
              </div>
              <div class="forms-count">${formsCount} inflected form${formsCount === 1 ? '' : 's'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openEntryDetail = function(id) {
      const e = dataList.find(x => x.id === id);
      if (!e) return;

      document.getElementById('modalHeadword').textContent = e.headword;
      document.getElementById('modalTranslit').textContent = (e.transliteration || '') + ' • ' + (e.pos_ta || e.pos) + ' • ' + e.category;

      const orig = e.original;
      let origHtml = '';
      if (orig && (orig.lemma || orig.strongs)) {
        const langName = orig.lang === 'he' ? 'Biblical Hebrew' : (orig.lang === 'grc' ? 'Koine Greek' : 'Original Language');
        origHtml = `
          <div class="original-banner">
            <div class="original-word">${orig.lemma || ''}</div>
            <div class="original-details">
              <strong>${langName}</strong>
              <span>Strong's ${orig.strongs || '—'} ${orig.translit ? '(' + orig.translit + ')' : ''}</span>
            </div>
          </div>
        `;
      }

      const modernTags = (e.modern_equivalents || []).map(m => '<span class="tag-item modern-synonym">' + m + '</span>').join('');
      const formsTags = (e.forms || []).map(f => '<span class="tag-item">' + f + '</span>').join('');

      let examplesHtml = '';
      if (e.examples && e.examples.length > 0) {
        examplesHtml = `
          <div class="section-block">
            <div class="section-title">Classical Scripture Examples</div>
            ${e.examples.map(ex => `
              <div class="example-card">
                <p class="ta">${ex.sentence_ta}</p>
                <p class="en">${ex.sentence_en}</p>
              </div>
            `).join('')}
          </div>
        `;
      }

      let notesHtml = '';
      if (e.notes) {
        notesHtml = `
          <div class="section-block" style="border-left: 3px solid var(--accent-blue);">
            <div class="section-title" style="color: var(--accent-blue);">Theological & Historical Study Note</div>
            <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.6;">${e.notes}</p>
          </div>
        `;
      }

      document.getElementById('modalBody').innerHTML = `
        ${origHtml}

        <div class="section-block">
          <div class="section-title">Definition / விளக்கம்</div>
          <div class="def-tamil">${e.definition_ta}</div>
          <div class="def-english"><strong>${e.gloss_en}:</strong> ${e.definition_en}</div>
        </div>

        ${modernTags ? `
          <div class="section-block">
            <div class="section-title">Contemporary Vernacular Equivalents (தற்கால வழக்கு)</div>
            <div class="tags-cluster">${modernTags}</div>
          </div>
        ` : ''}

        ${formsTags ? `
          <div class="section-block">
            <div class="section-title">Textual Surface Forms in Scripture</div>
            <div class="tags-cluster">${formsTags}</div>
          </div>
        ` : ''}

        ${notesHtml}
        ${examplesHtml}
      `;

      detailModal.classList.add('open');
      document.body.style.overflow = 'hidden';
    };

    function closeModal() {
      detailModal.classList.remove('open');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchClear.style.display = searchQuery ? 'block' : 'none';
      renderCards();
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClear.style.display = 'none';
      searchInput.focus();
      renderCards();
    });

    categoriesBar.addEventListener('click', (e) => {
      const chip = e.target.closest('.category-chip');
      if (!chip) return;
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.cat;
      renderCards();
    });

    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
    });

    renderCards();
  </script>
</body>
</html>
