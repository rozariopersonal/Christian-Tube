name: mobile
description: "ChristianTube - High quality Christian videos, shorts, devotions, and channels."
publish_to: 'none'
version: 1.28.0+45

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: any
  timeago: ^3.6.1

  # Networking & HTTP
  dio: ^5.4.3+1
  dio_smart_retry: ^6.0.0
  http: ^1.2.1

  # Media & YouTube Streaming
  video_player: ^2.8.6
  youtube_player_iframe: ^5.1.2
  youtube_explode_dart: ^2.2.1

  # Authentication & Storage
  google_sign_in: ^6.2.1
  sqflite: ^2.3.3+1
  shared_preferences: ^2.2.3
  path: ^1.9.0
  uuid: ^4.4.0
  rxdart: ^0.27.7

  # Device & Notifications
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  # Updates & Platform
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/
