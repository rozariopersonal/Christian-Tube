appId: org.rozario.christiantube.mobile
---
- launchApp:
    clearState: true
- tapOn:
    text: "Later"
    optional: true

# 1. Navigate to Bible Tab
- tapOn:
    id: "tab_Bible"
- extendedWaitUntil:
    visible: "Bible Translation:.*"
    timeout: 60000

# 2. Select a known English translation using accessible controls.
- tapOn: "Bible Translation:.*"
- tapOn: "Search translation, code, or language..."
- inputText: "KJV"
- tapOn: "(?s)KJV.*King James Version.*"

# 3. Open Book/Chapter Picker
- tapOn: "Book and chapter selector:.*"

# 4. Select a book and chapter
- tapOn: "Genesis"
- tapOn: "1"
- extendedWaitUntil:
    visible: "1"
    timeout: 60000
- tapOn: "1"

# 5. Wait for the streamed chapter, then select verse 1.
- extendedWaitUntil:
    visible: '1\s*'
    timeout: 60000
- tapOn: '1\s*'

# 7. Open Verse Study using its explicit button (never by swiping the sheet).
- assertVisible: "Open Verse Study"
- tapOn: "Open Verse Study"
- assertVisible:
    text: "Study .*"
- assertVisible: "(?s)Concepts.*"
- assertVisible:
    text: "(?s)References .*"

# 8. Back returns to the reader with the verse selection intact.
- pressKey: Back
- assertVisible: "Open Verse Study"
- assertVisible: "Highlight"

# 9. Back dismisses the selection before leaving the reader.
- pressKey: Back
- assertNotVisible: "Open Verse Study"
