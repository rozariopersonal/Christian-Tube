name: Daily CFC Audio Catalog Sync

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * *'
    # Run at 17:10 UTC (10:40 PM IST)
    - cron: '10 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-audio:
    name: Sync CFC Audio Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_RELEASES || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Audio Synchronizer
        run: node tool/sync_cfc_audio.js

      - name: Commit and Push Catalog Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Commit and push updates directly into main repository source assets
          if [ -n "$(git status --porcelain apps/mobile/assets/audio/)" ]; then
            echo "Changes detected in apps/mobile/assets/audio/. Committing to source repo..."
            git add apps/mobile/assets/audio/
            git commit -m "chore(audio): sync CFC India audio catalog in source assets [skip ci]"
            git push origin main
            echo "Source audio catalog in apps/mobile/assets/audio/ successfully committed and pushed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "No audio source asset changes detected in apps/mobile/assets/audio/."
          fi

          # 2. Check and commit updates in releases submodule if needed
          cd releases
          if [ -n "$(git status --porcelain audio/)" ]; then
            echo "Changes detected in releases/audio/. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add audio/
            git commit -m "chore(audio): sync CFC India audio catalog [skip ci]"
            git push origin main
            
            cd ..
            git add releases
            git commit -m "chore(releases): update audio catalog submodule pointer [skip ci]"
            git push origin main
            echo "Audio catalog in releases/ successfully synced and pushed!" >> $GITHUB_STEP_SUMMARY
          else
            cd ..
            echo "No audio catalog changes detected in releases/."
          fi
