name: Generate and Commit Static Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        run: |
          mkdir -p apps/mobile/android/app
          keytool -genkey -v -keystore apps/mobile/android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass "christian123" -keypass "christian123" -dname "CN=ChristianTube, OU=Mobile, O=Rozario, L=City, ST=State, C=US"
          
      - name: Extract SHA-1 Fingerprint
        run: |
          echo "=========================================================="
          echo "YOUR SHA-1 FINGERPRINT (COPY THIS TO GOOGLE CLOUD CONSOLE):"
          keytool -list -v -keystore apps/mobile/android/app/release.keystore -alias release -storepass "christian123" | grep "SHA1:"
          echo "=========================================================="

      - name: Commit Keystore to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apps/mobile/android/app/release.keystore
          git commit -m "chore: auto-generated static release keystore"
          git push origin main
