name: Build and Release Multi-Instance APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g., v1.28.0)'
        required: false
        default: 'v1.28.0'

permissions:
  contents: write

jobs:
  auto-tag:
    name: Auto Tag Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      
      - name: Bump version and push tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  release-matrix:
    name: Build & Release (${{ matrix.appName }})
    needs: auto-tag
    if: |
      always() && 
      (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.new_tag != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: christian_tube
            appName: ChristianTube
            apkName: christian-tube.apk
            releaseRepo: rozariopersonal/Christian-Tube-Releases
          - instance: centum_tube
            appName: CentumTube
            apkName: centum-tube.apk
            releaseRepo: rozariopersonal/Centum-Tube-Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python for QR Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python QR Code Generator
        run: pip install qrcode[pil]

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="${{ needs.auto-tag.outputs.new_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Release Tag: $TAG"

      - name: Prepare Instance Configuration & Assets
        run: |
          node scripts/prepare-instance.js ${{ matrix.instance }}

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Stage Release Artifacts
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk ./${{ matrix.apkName }}
          DOWNLOAD_URL="https://github.com/${{ matrix.releaseRepo }}/releases/download/${{ env.TAG }}/${{ matrix.apkName }}"
          echo "Generating QR Code for: $DOWNLOAD_URL"
          python3 -c "import qrcode; img = qrcode.make('$DOWNLOAD_URL'); img.save('download-qrcode.png')"

      - name: Verify Staged Artifacts
        run: |
          ls -la ${{ matrix.apkName }} download-qrcode.png

      - name: Publish Release to Dedicated Repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing ${{ matrix.appName }} release ${{ env.TAG }} to ${{ matrix.releaseRepo }}..."
          
          # Delete existing release/tag in target repo if exists to prevent duplication collisions
          gh release delete "${{ env.TAG }}" --repo "${{ matrix.releaseRepo }}" --yes || true
          git push "https://${GH_TOKEN}@github.com/${{ matrix.releaseRepo }}.git" --delete "${{ env.TAG }}" || true

          # Create Release in Target Repository
          gh release create "${{ env.TAG }}" \
            ./${{ matrix.apkName }} \
            ./download-qrcode.png \
            --repo "${{ matrix.releaseRepo }}" \
            --title "${{ matrix.appName }} ${{ env.TAG }}" \
            --notes "### 🚀 What's New in ${{ matrix.appName }} ${{ env.TAG }}
          - Multi-instance PrivateTube white-label engine
          - Modernized interactive update popup modal with in-place download progress
          - High-speed video feed streaming and YouTube sync
          - Performance optimizations and stability improvements

          ---
          **Direct Download**: [${{ matrix.apkName }}](https://github.com/${{ matrix.releaseRepo }}/releases/download/${{ env.TAG }}/${{ matrix.apkName }})

          <img src=\"https://github.com/${{ matrix.releaseRepo }}/releases/download/${{ env.TAG }}/download-qrcode.png\" width=\"220\" alt=\"Scan to Download APK\" />" \
            --latest
