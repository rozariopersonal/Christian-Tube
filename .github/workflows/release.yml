name: Build and Release Multi-Instance APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g., v1.28.0)'
        required: false
        default: 'v1.28.0'

permissions:
  contents: write

jobs:
  auto-tag:
    name: Auto Tag Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Bump version and push tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  release-matrix:
    name: Build & Release (${{ matrix.appName }})
    needs: auto-tag
    if: |
      always() && 
      (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.new_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: christian_tube
            appName: ChristianApp
            apkName: christian-app.apk
            releaseRepo: rozariopersonal/Christian-Tube-Releases
          - instance: centum_academy
            appName: CentumAcademy
            apkName: centum-academy.apk
            releaseRepo: rozariopersonal/Centum-Academy-Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            RAW_TAG="${{ needs.auto-tag.outputs.new_tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          # Standardize tag formatting
          RAW_TAG="${RAW_TAG#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          FINAL_TAG="v${CLEAN_VERSION}"
          
          echo "TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "Resolved Release Tag: $FINAL_TAG (Version: $CLEAN_VERSION)"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Instance Configuration & Assets
        run: |
          node scripts/prepare-instance.js ${{ matrix.instance }}

      - name: Ensure Gradle Permissions
        run: |
          if [ -f apps/mobile/android/gradlew ]; then
            chmod +x apps/mobile/android/gradlew
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set, skipping secure signing."
          fi

      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter --version
          flutter pub get

      - name: Build Android Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd apps/mobile
          echo "Building Release APK for ${{ matrix.appName }} version ${{ env.VERSION_NAME }}..."
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --target-platform=android-arm64 --obfuscate --split-debug-info=./build/app/outputs/symbols --build-name="${{ env.VERSION_NAME }}" --android-skip-build-dependency-validation

      - name: Locate & Stage APK
        run: |
          APK_PATH=""
          if [ -f "apps/mobile/build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            APK_PATH="apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          elif [ -f "apps/mobile/build/app/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="apps/mobile/build/app/outputs/apk/release/app-release.apk"
          else
            APK_PATH=$(find apps/mobile/build -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated!"
            exit 1
          fi
          
          cp "$APK_PATH" ./${{ matrix.apkName }}
          APK_SIZE=$(ls -lh ./${{ matrix.apkName }} | awk '{print $5}')
          echo "✅ ${{ matrix.apkName }} successfully built and staged (Size: $APK_SIZE)"

      - name: Generate Companion QR Code
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode
          DOWNLOAD_URL="https://github.com/${{ matrix.releaseRepo }}/releases/download/${{ env.TAG }}/${{ matrix.apkName }}"
          echo "Generating QR code for: $DOWNLOAD_URL"
          qrencode -o download-qrcode.png -s 10 -m 2 -l M "$DOWNLOAD_URL"
          ls -la ${{ matrix.apkName }} download-qrcode.png

      - name: Prepare Release Notes
        run: |
          cat << 'EOF' > release_body.md
          ### 🚀 What's New in ${{ matrix.appName }} ${{ env.TAG }}
          - Multi-instance PrivateTube white-label engine
          - Modernized interactive update popup modal with in-place download progress
          - High-speed video feed streaming and YouTube sync
          - Performance optimizations and stability improvements

          ---
          **Direct Download**: [${{ matrix.apkName }}](https://github.com/${{ matrix.releaseRepo }}/releases/download/${{ env.TAG }}/${{ matrix.apkName }})

          <img src="https://github.com/${{ matrix.releaseRepo }}/releases/download/${{ env.TAG }}/download-qrcode.png" width="220" alt="Scan to Download APK" />
          EOF

      - name: Publish Release to Dedicated Repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing ${{ matrix.appName }} release ${{ env.TAG }} to ${{ matrix.releaseRepo }}..."
          
          # Check if release already exists in target repo
          if gh release view "${{ env.TAG }}" --repo "${{ matrix.releaseRepo }}" > /dev/null 2>&1; then
            echo "Release ${{ env.TAG }} already exists. Updating release assets..."
            gh release upload "${{ env.TAG }}" \
              --repo "${{ matrix.releaseRepo }}" \
              --clobber \
              ./${{ matrix.apkName }} \
              ./download-qrcode.png
          else
            echo "Creating new release ${{ env.TAG }}..."
            gh release create "${{ env.TAG }}" \
              ./${{ matrix.apkName }} \
              ./download-qrcode.png \
              --repo "${{ matrix.releaseRepo }}" \
              --title "${{ matrix.appName }} ${{ env.TAG }}" \
              --notes-file release_body.md
          fi
          
          echo "🎉 Successfully published ${{ matrix.appName }} ${{ env.TAG }} to ${{ matrix.releaseRepo }}!"
