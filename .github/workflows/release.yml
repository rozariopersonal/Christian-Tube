name: Build & Publish ChristianTube Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.28.0)'
        required: true
        default: 'v1.28.0'

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Resolve Version Tag
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.version }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          # Clean and standardize tag to vX.Y.Z
          RAW_TAG="${RAW_TAG#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          FINAL_TAG="v${CLEAN_VERSION}"
          
          echo "TAG_NAME=${FINAL_TAG}" >> $GITHUB_ENV
          echo "VERSION_NAME=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "Resolved Release Tag: ${FINAL_TAG} (Version: ${CLEAN_VERSION})"

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 5. Ensure Gradle Permissions
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: 6. Install Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: 7. Build Android Release APK
        run: |
          echo "Building Release APK for version ${{ env.VERSION_NAME }}..."
          flutter build apk --release --build-name="${{ env.VERSION_NAME }}" --android-skip-build-dependency-validation
          
          # Locate generated APK
          APK_PATH=""
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="build/app/outputs/apk/release/app-release.apk"
          else
            APK_PATH=$(find build -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated!"
            exit 1
          fi
          
          cp "$APK_PATH" christian-tube.apk
          APK_SIZE=$(ls -lh christian-tube.apk | awk '{print $5}')
          echo "✅ christian-tube.apk successfully built (Size: $APK_SIZE)"

      - name: 8. Generate Companion QR Code
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode
          DOWNLOAD_URL="https://github.com/rozariopersonal/Christian-Tube-Releases/releases/download/${{ env.TAG_NAME }}/christian-tube.apk"
          
          echo "Generating QR code for direct URL: $DOWNLOAD_URL"
          qrencode -o download-qrcode.png -s 10 -m 2 -l M "$DOWNLOAD_URL"
          
          if [ ! -s download-qrcode.png ]; then
            echo "::error::Failed to generate valid QR code!"
            exit 1
          fi
          echo "✅ download-qrcode.png successfully generated"

      - name: 9. Prepare Release Notes
        run: |
          cat << 'EOF' > release_body.md
          📱 A new version of ChristianTube is available!

          ## 📥 Install on Android
          1. Scan the QR code image attached below, or tap the direct download link
          2. Open the downloaded APK on your Android device
          3. If prompted, enable **Install from unknown sources** in your settings
          4. Tap Install — enjoy ChristianTube!
          EOF

      - name: 10. Publish to Christian-Tube-Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TARGET_REPO="rozariopersonal/Christian-Tube-Releases"
          
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PAT secret is missing or empty! Please add RELEASE_PAT in repository secrets."
            exit 1
          fi

          echo "Publishing ${{ env.TAG_NAME }} to $TARGET_REPO..."

          # Check if release already exists in target repo
          if gh release view "${{ env.TAG_NAME }}" --repo "$TARGET_REPO" > /dev/null 2>&1; then
            echo "Release ${{ env.TAG_NAME }} already exists. Updating release assets..."
            gh release upload "${{ env.TAG_NAME }}" \
              --repo "$TARGET_REPO" \
              --clobber \
              christian-tube.apk \
              download-qrcode.png
          else
            echo "Creating new release ${{ env.TAG_NAME }}..."
            gh release create "${{ env.TAG_NAME }}" \
              --repo "$TARGET_REPO" \
              --title "ChristianTube ${{ env.TAG_NAME }}" \
              --notes-file release_body.md \
              --clobber \
              christian-tube.apk \
              download-qrcode.png
          fi
          
          echo "🎉 Successfully published release ${{ env.TAG_NAME }} to $TARGET_REPO!"
