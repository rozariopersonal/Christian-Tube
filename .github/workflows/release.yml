name: Build and Release Multi-Instance APKs

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g., v1.28.0 or v1.28.0-beta.1)'
        required: false
        default: ''
      channel:
        description: 'Release Channel (prod or beta)'
        type: choice
        options:
          - prod
          - beta
        default: 'prod'
      is_prerelease:
        description: 'Mark as Pre-release / Beta'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # GATE 1: CODE & UNIT QUALITY GATE
  # ============================================================================
  code_quality_gate:
    name: 'Gate 1: Code & Unit Quality Gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-infos

      - name: Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

  # ============================================================================
  # AUTO-TAG (MAIN OR DEVELOP BRANCH)
  # ============================================================================
  auto_tag:
    name: Auto Tag Release
    needs: code_quality_gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          pre_release_branches: develop
          append_to_pre_release_tag: beta

  # ============================================================================
  # GATE 2 & 3: BUILD APK & E2E QUALITY GATE
  # ============================================================================
  release_matrix:
    name: Build & Release (${{ matrix.appName }})
    needs: [code_quality_gate, auto_tag]
    if: |
      always() && 
      (needs.code_quality_gate.result == 'success') &&
      (needs.auto_tag.result == 'success' || needs.auto_tag.result == 'skipped') &&
      (github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop') || needs.auto_tag.outputs.new_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: christian_tube
            appName: ChristianApp
            apkName: christian-app.apk
            betaApkName: christian-app-beta.apk
            releaseRepo: rozariopersonal/Christian-Tube-Releases
          - instance: centum_academy
            appName: CentumAcademy
            apkName: centum-academy.apk
            betaApkName: centum-academy-beta.apk
            releaseRepo: rozariopersonal/Centum-Academy-Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag and Channel
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ needs.auto_tag.outputs.new_tag }}" ]; then
            RAW_TAG="${{ needs.auto_tag.outputs.new_tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Standardize tag formatting
          RAW_TAG="${RAW_TAG#refs/tags/}"
          CLEAN_VERSION="${RAW_TAG#v}"
          FINAL_TAG="v${CLEAN_VERSION}"

          # Determine Channel (beta vs prod)
          CHANNEL="prod"
          IS_PRERELEASE="false"
          if [ "${{ github.ref }}" = "refs/heads/develop" ] || [[ "$FINAL_TAG" == *"beta"* ]] || [ "${{ github.event.inputs.channel }}" = "beta" ] || [ "${{ github.event.inputs.is_prerelease }}" = "true" ]; then
            CHANNEL="beta"
            IS_PRERELEASE="true"
          fi

          if [ "$CHANNEL" = "beta" ]; then
            TARGET_APK_NAME="${{ matrix.betaApkName }}"
            TARGET_APP_NAME="${{ matrix.appName }} Beta"
          else
            TARGET_APK_NAME="${{ matrix.apkName }}"
            TARGET_APP_NAME="${{ matrix.appName }}"
          fi

          echo "TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "TARGET_APK_NAME=$TARGET_APK_NAME" >> $GITHUB_ENV
          echo "TARGET_APP_NAME=$TARGET_APP_NAME" >> $GITHUB_ENV
          echo "Resolved Tag: $FINAL_TAG | Channel: $CHANNEL | Prerelease: $IS_PRERELEASE | Target APK: $TARGET_APK_NAME"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11 & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow for Icon Processing
        run: |
          python -m pip install --upgrade pip pillow

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Instance Configuration & Assets
        run: |
          node scripts/prepare-instance.js ${{ matrix.instance }} ${{ env.CHANNEL }}

      - name: Ensure Gradle Permissions
        run: |
          if [ -f apps/mobile/android/gradlew ]; then
            chmod +x apps/mobile/android/gradlew
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set, skipping secure signing."
          fi

      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter --version
          flutter pub get

      - name: Build Android Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd apps/mobile
          echo "Building Release APK for ${{ env.TARGET_APP_NAME }} version ${{ env.VERSION_NAME }}..."
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=./build/app/outputs/symbols --build-name="${{ env.VERSION_NAME }}" --android-skip-build-dependency-validation

      - name: Locate & Stage APK
        run: |
          APK_PATH=""
          if [ -f "apps/mobile/build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            APK_PATH="apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          elif [ -f "apps/mobile/build/app/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="apps/mobile/build/app/outputs/apk/release/app-release.apk"
          else
            APK_PATH=$(find apps/mobile/build -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated!"
            exit 1
          fi

          cp "$APK_PATH" ./${{ env.TARGET_APK_NAME }}
          APK_SIZE=$(ls -lh ./${{ env.TARGET_APK_NAME }} | awk '{print $5}')
          echo "✅ ${{ env.TARGET_APK_NAME }} successfully built and staged (Size: $APK_SIZE)"

      # ========================================================================
      # GATE 3: E2E QUALITY GATE (MAESTRO EMULATOR SMOKE TEST)
      # ========================================================================
      - name: 'Gate 3: E2E Quality Gate (Android Emulator Smoke Test)'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            # Install Maestro CLI
            curl -FsSL "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"

            # Install staged APK onto emulator
            echo "Installing ${{ env.TARGET_APK_NAME }} on emulator..."
            adb install ./${{ env.TARGET_APK_NAME }}

            # Run Maestro E2E smoke test
            echo "Running Maestro smoke flow..."
            maestro test .maestro/smoke_flow.yaml

      - name: Upload E2E Test Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ matrix.instance }}
          path: ~/.maestro/tests/

      - name: Generate Companion QR Code
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode
          DOWNLOAD_URL="https://github.com/${{ matrix.releaseRepo }}/releases/download/${{ env.TAG }}/${{ env.TARGET_APK_NAME }}"
          echo "Generating QR code for: $DOWNLOAD_URL"
          qrencode -o download-qrcode.png -s 10 -m 2 -l M "$DOWNLOAD_URL"
          ls -la ${{ env.TARGET_APK_NAME }} download-qrcode.png

      - name: Prepare Dynamic Release Notes
        run: |
          node scripts/generate-release-notes.js \
            "${{ env.TARGET_APP_NAME }}" \
            "${{ env.TAG }}" \
            "${{ env.CHANNEL }}" \
            "${{ matrix.releaseRepo }}" \
            "${{ env.TARGET_APK_NAME }}" \
            "release_body.md"

      # ========================================================================
      # GATE 4: PUBLISH RELEASE TO DEDICATED REPOSITORY
      # ========================================================================
      - name: Publish Release to Dedicated Repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing ${{ env.TARGET_APP_NAME }} release ${{ env.TAG }} to ${{ matrix.releaseRepo }}..."

          PRERELEASE_FLAG=""
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            echo "Marking release as PRE-RELEASE (Beta)"
            PRERELEASE_FLAG="--prerelease"
          fi

          # Check if release already exists in target repo
          if gh release view "${{ env.TAG }}" --repo "${{ matrix.releaseRepo }}" > /dev/null 2>&1; then
            echo "Release ${{ env.TAG }} already exists. Updating release assets..."
            gh release upload "${{ env.TAG }}" \
              --repo "${{ matrix.releaseRepo }}" \
              --clobber \
              ./${{ env.TARGET_APK_NAME }} \
              ./download-qrcode.png
          else
            echo "Creating new release ${{ env.TAG }}..."
            gh release create "${{ env.TAG }}" \
              ./${{ env.TARGET_APK_NAME }} \
              ./download-qrcode.png \
              --repo "${{ matrix.releaseRepo }}" \
              --title "${{ env.TARGET_APP_NAME }} ${{ env.TAG }}" \
              --notes-file release_body.md \
              $PRERELEASE_FLAG
          fi

          echo "🎉 Successfully published ${{ env.TARGET_APP_NAME }} ${{ env.TAG }} to ${{ matrix.releaseRepo }}!"
