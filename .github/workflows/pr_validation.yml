name: Pull Request Quality Gate & Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main
    paths:
      - 'apps/mobile/**'
      - 'apps/backend/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'releases/**'
      - 'package.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  paths:
    name: 'Detect Changed Paths'
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'releases/**'
              - 'package.json'
            backend:
              - 'apps/backend/**'
              - '.github/workflows/**'

  # ============================================================================
  # GATE 1: CODE & UNIT QUALITY GATE
  # ============================================================================
  backend_quality_check:
    name: 'Backend Quality Gate (Jest & TypeScript)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: paths
    if: needs.paths.outputs.backend == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Prisma Schema Validation
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: npx prisma validate
        working-directory: apps/backend

      - name: Backend Unit Tests
        run: npm test -- --runInBand
        working-directory: apps/backend

      - name: TypeScript Compile
        run: npm run build
        working-directory: apps/backend

  # ============================================================================
  # GATE 1: CODE & UNIT QUALITY GATE
  # ============================================================================
  pr_quality_check:
    name: 'PR Quality Gate (Flutter Analyze & Tests)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: paths
    if: needs.paths.outputs.mobile == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-infos

      - name: Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

  # ============================================================================
  # AUTOMATED MERGE TO DEVELOP BRANCH
  # ============================================================================
  auto_merge:
    name: 'Auto-Merge to Develop Branch'
    needs: [paths, pr_quality_check, backend_quality_check]
    if: |
      always() &&
      github.event.pull_request.base.ref == 'develop' &&
      (needs.pr_quality_check.result == 'success' || needs.pr_quality_check.result == 'skipped') &&
      (needs.backend_quality_check.result == 'success' || needs.backend_quality_check.result == 'skipped') &&
      !(needs.pr_quality_check.result == 'skipped' && needs.backend_quality_check.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Automatically Merge PR into develop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR #${PR_NUMBER} passed quality checks. Auto-merging into develop..."
          gh pr merge "$PR_NUMBER" --merge --auto || \
          gh pr merge "$PR_NUMBER" --merge --admin || \
          gh pr merge "$PR_NUMBER" --merge
          echo "🎉 Successfully merged PR #${PR_NUMBER} into develop!"
