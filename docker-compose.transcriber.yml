# Transcription + AI-insights service for the Christian-Tube instance.
#
# Stack:
#   db       - PostgreSQL 16 backed by the existing christian-tube_pgdata volume.
#   llm      - Ollama serving Qwen2.5 7B Instruct on CPU (no GPU needed).
#   worker   - polls the DB, transcribes pending videos with
#              faster-whisper large-v3-turbo, and publishes transcripts +
#              extracted biblical insights to the releases repo via the
#              GitHub Contents API (no git credentials on this machine).
#
# Usage:
#   .transcriber.env           # copy from .transcriber.env.example, fill secrets
#   scripts/start-transcriber.ps1   # builds + starts + registers logon task
#   docker compose -f docker-compose.transcriber.yml up -d --build
#
# Model caches and worker scratch live in Docker named volumes (Windows bind
# mounts cannot rename/delete container-created files, so named volumes are
# required): ollama-models, whisper-models, transcriber-work.

services:
  db:
    image: postgres:16
    container_name: christiantube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: christiantube
    volumes:
      - christian-tube_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d christiantube"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcriber

  llm:
    # Pinned to the digest verified on this host (2026-09-02); the unpinned
    # `latest` tag regressed to stub runners once and broke model loading.
    image: ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    container_name: christiantube-llm
    restart: unless-stopped
    environment:
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NOPRUNE: "true"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - transcriber

  worker:
    build:
      context: ./services/transcriber
    container_name: christiantube-transcriber
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_healthy
    env_file:
      - .transcriber.env
    environment:
      WHISPER_MODEL: large-v3-turbo
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      WHISPER_MODEL_DIR: /opt/models
      WORK_DIR: /work
      POLL_INTERVAL: "300"
      BATCH_LIMIT: "5"
      LLM_URL: http://llm:11434
      LLM_MODEL: qwen2.5:7b
      LLM_CONTEXT: "32768"
    volumes:
      - whisper-models:/opt/models
      - transcriber-work:/work
    networks:
      - transcriber

volumes:
  christian-tube_pgdata:
    external: true
  ollama-models:
    external: true
    name: christian-tube_ollama-models
  whisper-models:
    external: true
    name: christian-tube_whisper-models
  transcriber-work:

networks:
  transcriber:
    driver: bridge