# Transcription + AI-insights service for the Christian-Tube instance.
#
# Stack (Windows-native models + Docker harness — see
# docs/transcriber-windows-native-plan.md):
#   db     - PostgreSQL 16 backed by the existing christian-tube_pgdata volume.
#   worker - polls the DB, downloads audio with yt-dlp, sends it to a NATIVE
#            Windows whisper server (host.docker.internal:12788) for STT, runs
#            insight extraction against a NATIVE Windows Ollama
#            (host.docker.internal:11434, qwen2.5:7b), and publishes transcripts
#            + insights to the releases repo via the GitHub Contents API.
#
# The LLM and Whisper models run as native Windows processes (managed by
# scripts/ctrl.ps1), so no GPU/ML container is needed here and the recurring
# Docker-on-Windows model friction is avoided.
#
# Usage:
#   scripts/ctrl.ps1 ollama start      # native Ollama LLM on the Windows host
#   scripts/ctrl.ps1 whisper start     # native whisper server on the Windows host
#   scripts/ctrl.ps1 stack up          # this compose stack (db + worker)
#   scripts/ctrl.ps1 status
#
# Worker scratch lives in the transcriber-work volume. The Docker worker reaches
# the host-native services via the host-gateway extra_hosts entry.

services:
  db:
    image: postgres:16
    container_name: christiantube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: christiantube
    volumes:
      - christian-tube_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d christiantube"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcriber

  worker:
    build:
      context: ./services/transcriber
    container_name: christiantube-transcriber
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .transcriber.env
    environment:
      WORK_DIR: /work
      POLL_INTERVAL: "300"
      BATCH_LIMIT: "5"
      LLM_URL: http://host.docker.internal:11434
      LLM_MODEL: qwen2.5:7b
      LLM_CONTEXT: "32768"
      LLM_TIMEOUT: "2100"
      WHISPER_URL: http://host.docker.internal:12788
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - transcriber-work:/work
    networks:
      - transcriber

volumes:
  christian-tube_pgdata:
    external: true
  transcriber-work:

networks:
  transcriber:
    driver: bridge
